<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frio — Cook More, Waste Less</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css" />

    <script>

      function toggleShow() {
        var menu = document.getElementById('menu')
        var hamburger = document.getElementById('mobile-menu')

        menu.classList.toggle('show')

        if (menu.classList.contains('show')) {
            hamburger.innerHTML = '&times;'
        } else {
            hamburger.innerHTML = '&#9776;'
        }
    }

    </script>
  </head>
  <body>
    <header>
      <h1 class="brand"><a href="#">Frio</a></h1>

       <span class="mobile-menu" id="mobile-menu" onclick="toggleShow()">&#9776;</span>

      <nav>
        <ul class="menu" id="menu">
          <li><a href="index.html">HOME</a></li>
          <li><a href="recipes.html">RECIPES</a></li>
          <li><a href="fridge.html">MY FRIDGE</a></li>
        </ul>
      </nav>
    </header>

  
    <main>
        <!-- MY FRIDGE PAGE -->
         <section class="fridge-page">
            <h1>My Fridge</h1>
            <p>Keep track of your ingredients and reduce food waste.</p>
            
            <!-- Search Ingredients -->
             <input
             type="text"
             class="fridge-search"
             id="fridge-search"
             placeholder="Search ingredients..."
             >


            <div class="fridge-heading">
                <h2>My Ingredients</h2>
                <button class="add-ingredient-btn">+ Add Ingredient</button>
            </div>


<!-- Add Ingredient Form -->
<div class="add-ingredient-form" id="add-ingredient-form" hidden>

    <h3>Add New Ingredient</h3>

    <form id="ingredient-form">

        <label for="ingredient-name">Ingredient Name</label>
        <input
            type="text"
            id="ingredient-name"
            placeholder="e.g. Tomato"
            required
        >

        <label for="ingredient-category">Category</label>
        <select id="ingredient-category">
            <option value="vegetable">Vegetable</option>
            <option value="meat">Meat</option>
            <option value="fruits">Fruits</option>
            <option value="dairy">Dairy</option>
            <option value="others">Others</option>
        </select>

        <label for="ingredient-days">Days Until Expiry</label>
        <input
            type="number"
            id="ingredient-days"
            min="0"
            placeholder="e.g. 3"
            required
        >

        <button type="submit">Add</button>
        <button type="button" id="cancel-ingredient">Cancel</button>

    </form>
</div>

            
            <!-- Fridge Filters -->

            <div class="fridge-filters">
                <button class="fridge-filter-btn active" data-filter="all">All</button>
                <button class="fridge-filter-btn" data-filter="near-expiry">Near-expiry</button>
                <button class="fridge-filter-btn" data-filter="fresh">Fresh</button>
                <button class="fridge-filter-btn" data-filter="meat">Meat</button>
                <button class="fridge-filter-btn" data-filter="vegetable">Vegetable</button>
                <button class="fridge-filter-btn" data-filter="fruits">Fruits</button>
                <button class="fridge-filter-btn" data-filter="dairy">Dairy</button>
                <button class="fridge-filter-btn" data-filter="others">Others</button>
            </div>


            <div class="ingredient-list">

                <div class="ingredient-card"
                data-category="dairy"
                data-days="2">
                    <span>Milk</span>
                    <span>2 days left</span>
                </div>

                <div class="ingredient-card"
                data-category="vegetable"
                data-days="3">
                    <span>Spinach</span>
                    <span>3 days left</span>
                </div>

                <div class="ingredient-card"
                data-category="meat"
                data-days="4">
                    <span>Chicken</span>
                    <span>4 days left</span>
                </div>

                <div class="ingredient-card"
                data-category="others"
                data-days="7">
                    <span>Eggs</span>
                    <span>7 days left</span>
                </div>

            </div>

        </section>

    </main>

    <script>
  // Find the search input
  const search = document.querySelector('.fridge-search');

  // Find all ingredient cards
  const ingredients = document.querySelectorAll('.ingredient-card');

  // Find all fridge filter buttons
const filterButtons = document.querySelectorAll('.fridge-filter-btn');

  // Remember which filter is selected
let currentFilter = 'all';


function filterIngredients() {
    // Get what the user typed
    const searchText = search.value.toLowerCase();

    // Check every ingredient card
    ingredients.forEach(function(ingredient) {
        const name = ingredient.querySelector('span').textContent.toLowerCase();

        // Read ingredient category and days left
        const category = ingredient.dataset.category;
        const days = Number(ingredient.dataset.days);

        // Check if the ingredient matches the search
        const matchesSearch = name.includes(searchText);

        // Check if the ingredient matches the selected filter
        let matchesFilter = false;

        if (currentFilter === 'all') {
            matchesFilter = true;
        } else if (currentFilter === 'near-expiry') {
            matchesFilter = days <= 3;
        } else if (currentFilter === 'fresh') {
            matchesFilter = days > 3;
        } else {
            matchesFilter = category === currentFilter;
        }

        // Show only ingredients that match both
        if (matchesSearch && matchesFilter) {
            ingredient.style.display = '';
        } else {
            ingredient.style.display = 'none';
        }
    });
}


 // Run the filter whenever the user types
search.addEventListener('input', filterIngredients);

// Run the filter whenever a button is clicked
filterButtons.forEach(function(button) {
    button.addEventListener('click', function() {

        // Remember which filter was clicked
        currentFilter = button.dataset.filter;

        // Update the active button style
        filterButtons.forEach(function(btn) {
            btn.classList.remove('active');
        });

        button.classList.add('active');

        // Filter the ingredients
        filterIngredients();
    });
});

// Show the correct ingredients when the page loads
filterIngredients();


// Find the Add Ingredient button and form
const addButton = document.querySelector('.add-ingredient-btn');
const addForm = document.getElementById('add-ingredient-form');
const cancelButton = document.getElementById('cancel-ingredient');

// Open the form
addButton.addEventListener('click', function() {
    addForm.hidden = false;
});

// Close the form
cancelButton.addEventListener('click', function() {
    addForm.hidden = true;
});


  </script>

  </body>
</html>
