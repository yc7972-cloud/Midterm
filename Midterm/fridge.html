<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frio — Cook More, Waste Less</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css" />

    <script>

      function toggleShow() {
        var menu = document.getElementById('menu')
        var hamburger = document.getElementById('mobile-menu')

        menu.classList.toggle('show')

        if (menu.classList.contains('show')) {
            hamburger.innerHTML = '&times;'
        } else {
            hamburger.innerHTML = '&#9776;'
        }
    }

    </script>
  </head>
  <body>
    <header>
      <h1 class="brand"><a href="#">Frio</a></h1>

       <span class="mobile-menu" id="mobile-menu" onclick="toggleShow()">&#9776;</span>

      <nav>
        <ul class="menu" id="menu">
          <li><a href="index.html">HOME</a></li>
          <li><a href="recipes.html">RECIPES</a></li>
          <li><a href="fridge.html">MY FRIDGE</a></li>
        </ul>
      </nav>
    </header>

  
    <main>
        <!-- MY FRIDGE PAGE -->
         <section class="fridge-page">
            <h1>My Fridge</h1>
            <p>Keep track of your ingredients and reduce food waste.</p>
            
            <!-- Search Ingredients -->
             <input
             type="text"
             class="fridge-search"
             id="fridge-search"
             placeholder="Search ingredients..."
             >


            <div class="fridge-heading">
                <h2>My Ingredients</h2>
                <button class="add-ingredient-btn">+ Add Ingredient</button>
            </div>
            
            <!-- Fridge Filters -->

            <div class="fridge-filters">
                <button class="fridge-filter-btn active">All</button>
                <button class="fridge-filter-btn">Near-expiry</button>
                <button class="fridge-filter-btn">Fresh</button>
                <button class="fridge-filter-btn">Meat</button>
                <button class="fridge-filter-btn">Vegetable</button>
                <button class="fridge-filter-btn">Fruits</button>
                <button class="fridge-filter-btn">Dairy</button>
                <button class="fridge-filter-btn">Others</button>
            </div>


            <div class="ingredient-list">

                <div class="ingredient-card">
                    <span>Milk</span>
                    <span>2 days left</span>
                </div>

                <div class="ingredient-card">
                    <span>Spinach</span>
                    <span>3 days left</span>
                </div>

                <div class="ingredient-card">
                    <span>Chicken</span>
                    <span>4 days left</span>
                </div>

                <div class="ingredient-card">
                    <span>Eggs</span>
                    <span>7 days left</span>
                </div>

            </div>

        </section>

    </main>

    <script>
  // Find the search input
  const search = document.getElementById('fridge-search');

  // Find all ingredient cards
  const ingredients = document.querySelectorAll('.ingredient-card');

  // Run whenever the user types
  search.addEventListener('input', function() {

    // Get the text the user typed
    const searchText = search.value.toLowerCase();

    // Check each ingredient
    ingredients.forEach(function(ingredient) {

      // Get the ingredient name
      const name = ingredient.querySelector('span').textContent.toLowerCase();

      // Show matching ingredients
      if (name.includes(searchText)) {
        ingredient.style.display = '';
      } else {
        ingredient.style.display = 'none';
      }

    });

  });
  
  </script>
  
  </body>
</html>
